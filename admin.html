<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23A9C5B0'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' font-family='Arial' font-weight='700' fill='%232F3B3A'%3EH%3C/text%3E%3C/svg%3E">
  <title>Admin Background — HCGA</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 520px; margin: 3rem auto; padding: 2rem; background: var(--card); border-radius: 28px; box-shadow: var(--shadow); }
    .admin-wrap h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
    .admin-wrap p.hint { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
    .field { display: grid; gap: 0.4rem; margin-bottom: 1.1rem; }
    .field label { font-weight: 800; }
    .field input[type="password"], .field input[type="file"] {
      font: inherit; padding: 0.75rem 1rem; border-radius: 16px; border: 1px solid #D5E6D8; background: #fff;
    }
    .preview { width: 100%; height: 180px; object-fit: cover; border-radius: 20px; margin-bottom: 1rem; background: #EEE; }
    .admin-wrap .btn-primary { border: none; cursor: pointer; width: 100%; text-align: center; }
    .back { display: inline-block; margin-top: 1.25rem; color: var(--sage-deep); font-weight: 800; text-decoration: none; }
    .result { margin-top: 1rem; font-weight: 800; }
    .result.ok { color: var(--sage-deep); }
    .result.bad { color: #8A3B3B; }
  </style>
</head>
<body>
  <div class="bg-tint" aria-hidden="true"></div>

  <main class="admin-wrap">
    <h1>Ganti Background Portal</h1>
    <p class="hint">
      Halaman ini khusus HCGA. Masukkan kunci admin, pilih gambar (JPG, PNG, atau WEBP, maksimal 2 MB),
      lalu simpan. Background akan tampil untuk semua pengunjung.
    </p>

    <form id="admin-form" novalidate>
      <div class="field">
        <label for="admin-key">Kunci admin</label>
        <input type="password" id="admin-key" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="bg-file">Gambar background</label>
        <input type="file" id="bg-file" accept="image/jpeg,image/png,image/webp" required>
      </div>

      <img id="preview" class="preview" alt="Pratinjau background" hidden>

      <button type="submit" class="btn-primary" id="submit-btn">Simpan Background</button>
      <p id="result" class="result" role="status"></p>
    </form>

    <a class="back" href="index.html">← Kembali ke portal</a>
  </main>

  <div id="loading" class="loading" aria-live="polite"><div class="spinner"></div></div>
  <div id="notif" class="notif" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
